# Ollama Cloud (OpenAI-compatible endpoint) — the five panelists.
#
# No key on disk: `api_key_name` only makes llm accept a --key flag; the actual value is
# passed per call as --key "$OLLAMA_API_KEY".
#
# `reasoning: true` is what exposes the `reasoning_effort` option. Without it llm won't
# let you set it, and the panel silently runs at the server default instead of max.
#
# Behind a system proxy that can't reach ollama.com, prefix commands with
# NO_PROXY='ollama.com'. Harmless on a machine with no proxy — every command in the skill
# carries it already.
#
# Live catalog, for when a model name drifts:
#   curl -s https://ollama.com/v1/models | jq -r '.data[].id'

- model_id: deepseek-flash
  model_name: deepseek-v4-flash:0731
  api_base: "https://ollama.com/v1"
  api_key_name: ollama
  reasoning: true

- model_id: nemotron
  model_name: nemotron-3-ultra
  api_base: "https://ollama.com/v1"
  api_key_name: ollama
  reasoning: true

- model_id: glm
  model_name: glm-5.2
  api_base: "https://ollama.com/v1"
  api_key_name: ollama
  reasoning: true

- model_id: kimi
  model_name: kimi-k2.7-code
  api_base: "https://ollama.com/v1"
  api_key_name: ollama
  reasoning: true

- model_id: minimax
  model_name: minimax-m3
  api_base: "https://ollama.com/v1"
  api_key_name: ollama
  reasoning: true

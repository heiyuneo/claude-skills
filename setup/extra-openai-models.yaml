# The five panelists. Each entry carries its own endpoint and its own key alias, so you can
# mix providers freely — route one model to a vendor's own API and leave the rest on a
# gateway, or give every model a different provider.
#
# Store each alias once, then never pass --key on the command line. A --key overrides
# api_key_name for every model at once while leaving each api_base alone, so one key gets
# presented to three different providers and the two that did not issue it answer 401:
#
#   llm keys set ollama
#   llm keys set deepseek
#   llm keys set zhipu
#
# llm writes them to keys.json in this directory with mode 0600. Prefer that over an
# environment variable: env vars leak into every child process you spawn, and every
# OpenAI-compatible model here falls back to the *same* OPENAI_API_KEY, so env vars cannot
# express per-provider keys at all.
#
# `reasoning: true` is what exposes the `reasoning_effort` option. Without it llm won't
# let you set it, and the panel silently runs at the server default instead of max.
#
# Behind a system proxy that can't reach ollama.com, prefix commands with
# NO_PROXY='ollama.com'. Harmless on a machine with no proxy — every command in the skill
# carries it already.
#
# Live catalog, for when a model name drifts:
#   curl -s https://ollama.com/v1/models | jq -r '.data[].id'

# Routed to DeepSeek's own API rather than the gateway. Two reasons: this was the least
# reliable panelist on the gateway (2 runaways + 2 silent empty returns in 14 calls), and
# the vendor's endpoint accepts a wider effort range (none/minimal/low/medium/high/xhigh/max).
- model_id: deepseek-flash
  model_name: deepseek-v4-flash
  api_base: "https://api.deepseek.com/v1"
  api_key_name: deepseek
  reasoning: true
  supports_tools: true

- model_id: nemotron
  model_name: nemotron-3-ultra
  api_base: "https://ollama.com/v1"
  api_key_name: ollama
  reasoning: true
  supports_tools: true

# Routed to Zhipu's own API: it carries glm-5.3, one release ahead of the gateway's 5.2.
# The docs call this endpoint non-OpenAI-compatible; in practice the OpenAI request shape
# works and llm drives it fine. Effort range: none/minimal/low/medium/high/xhigh/max.
- model_id: glm
  model_name: glm-5.3
  api_base: "https://open.bigmodel.cn/api/paas/v4"
  api_key_name: zhipu
  reasoning: true
  supports_tools: true

- model_id: kimi
  model_name: kimi-k3
  api_base: "https://ollama.com/v1"
  api_key_name: ollama
  reasoning: true
  supports_tools: true

- model_id: minimax
  model_name: minimax-m3
  api_base: "https://ollama.com/v1"
  api_key_name: ollama
  reasoning: true
  supports_tools: true
